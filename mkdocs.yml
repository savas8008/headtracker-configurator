site_name: FPV Head Tracker
site_description: ESP32-C3 tabanlı FPV head tracker — verici, alıcı ve konfigüratör dokümantasyonu
site_url: https://savas8008.github.io/headtracker-configurator/docs/
repo_url: https://github.com/savas8008/headtracker-configurator
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: _site/docs

theme:
  name: material
  language: tr
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Koyu temaya geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Açık temaya geç

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: tr
          name: Türkçe
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: FPV Head Tracker
          nav_translations:
            Başlangıç: Getting started
            Genel Bakış: Overview
            Donanım: Hardware
            Firmware Yükleme: Flashing
            Konfigüratör: Configurator
            Kullanım: Usage
            Çıkış Modları: Output modes
            ELRS Backpack: ELRS Backpack
            Sorun Giderme: Troubleshooting
            Geliştirici: Developer
            Teknik Notlar: Technical notes

nav:
  - Başlangıç:
      - Genel Bakış: index.md
      - Donanım: donanim.md
      - Firmware Yükleme: firmware.md
  - Kullanım:
      - Konfigüratör: konfigurator.md
      - Çıkış Modları: modlar.md
      - ELRS Backpack: backpack.md
      - Sorun Giderme: sorun-giderme.md
  - Geliştirici:
      - Teknik Notlar: gelistirici.md
